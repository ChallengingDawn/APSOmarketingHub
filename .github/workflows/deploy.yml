name: Build and push image to ECR

# Phase 1: build the container image and push it to Amazon ECR.
# (Once True Soft creates the Fargate service, add an ECS deploy step here —
#  see the commented block at the bottom.)

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  id-token: write      # required for OIDC — lets configure-aws-credentials get a token
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: eu-central-1
          role-to-assume: arn:aws:iam::905418292914:role/apso-github-actions-role

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}   # no trailing slash
          REPOSITORY: apsomarketinghub
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Stamp the image with its commit so /api/health can say which build
          # is actually running after a deployment.
          BUILT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker build \
            --build-arg GIT_SHA="$IMAGE_TAG" \
            --build-arg BUILT_AT="$BUILT_AT" \
            -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$REPOSITORY:prod" .
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:prod"

      # Without this the image sits in ECR and the running tasks never change —
      # every push since 15.09 built something nobody was serving, and the only
      # way to see a change was to force a deployment by hand in the console.
      # The task definition points at :prod, so a forced deployment pulls the
      # image this run just pushed.
      # Needs ecs:UpdateService + ecs:DescribeServices on apso-github-actions-role;
      # if the role lacks them this step fails loudly, and the image is still pushed.
      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster apso-dev \
            --service apso-dev-apsomarketinghub \
            --force-new-deployment \
            --no-cli-pager \
            --query 'service.{name:serviceName,taskDefinition:taskDefinition,desired:desiredCount}'
